<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydrophone Vessel Workbench</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Hydrophone Vessel Workbench</h1>
        <p id="sourceLine">Loading data</p>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <div class="toolbar">
          <div class="segmented" aria-label="Layer filter">
            <button class="segment mode-segment is-active" data-mode="vessels">Vessels</button>
            <button class="segment mode-segment" data-mode="ctd">CTD</button>
            <button class="segment mode-segment" data-mode="all">All</button>
          </div>
          <div class="segmented signal-toggle" aria-label="Signal filter">
            <button class="segment signal-segment is-active" data-signal-mode="strongest">Strongest</button>
            <button class="segment signal-segment" data-signal-mode="all">All signals</button>
          </div>
          <input id="searchInput" type="search" placeholder="Search" autocomplete="off">
        </div>
        <div id="entityList" class="entity-list"></div>
      </aside>

      <section class="map-panel">
        <div id="leafletMap" class="leaflet-map" aria-label="Real map"></div>
        <svg id="mapSvg" role="img" aria-label="Vessel and CTD map"></svg>
        <div class="map-legend">
          <span><i class="legend-dot vessel"></i>Vessel</span>
          <span><i class="legend-dot ctd"></i>CTD</span>
          <span><i class="legend-dot hydrophone"></i>Hydrophone</span>
        </div>
      </section>

      <aside class="detail-panel" id="detailPanel"></aside>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
